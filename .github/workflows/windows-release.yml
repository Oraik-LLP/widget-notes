name: Windows build and release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build and package
        shell: pwsh
        run: .\build.ps1
      - name: Storage diagnostics
        shell: pwsh
        run: |
          $testRoot = Join-Path $env:RUNNER_TEMP 'WidgetNotes-self-test'
          $process = Start-Process .\dist\package\WidgetNotes.exe -ArgumentList @('--self-test', "--test-root=$testRoot") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Storage diagnostics failed.' }
          $report = Get-Content (Join-Path $testRoot 'self-test.txt') -Raw
          if ($report -notmatch 'ALL TESTS PASSED') { throw 'Storage diagnostics did not report success.' }
          Write-Host $report
      - name: WPF interaction diagnostics
        shell: pwsh
        run: |
          $testRoot = Join-Path $env:RUNNER_TEMP 'WidgetNotes-ui-test'
          $process = Start-Process .\dist\package\WidgetNotes.exe -ArgumentList @('--ui-test', "--test-root=$testRoot") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'WPF interaction diagnostics failed.' }
          $report = Get-Content (Join-Path $testRoot 'ui-test.txt') -Raw
          if ($report -notmatch 'ALL UI TESTS PASSED') { throw 'WPF interaction diagnostics did not report success.' }
          Write-Host $report
      - name: Application window diagnostics
        shell: pwsh
        run: |
          $testRoot = Join-Path $env:RUNNER_TEMP 'WidgetNotes-application-test'
          $process = Start-Process .\dist\package\WidgetNotes.exe -ArgumentList @('--application-test', "--test-root=$testRoot") -Wait -PassThru
          $report = Get-Content (Join-Path $testRoot 'desktop-test.txt') -Raw
          if ($process.ExitCode -ne 0 -or $report -notmatch 'ALL APPLICATION CHECKS PASSED') { throw $report }
          Write-Host $report
      - uses: actions/upload-artifact@v7
        with:
          name: WidgetNotes-Windows-x64
          path: dist/WidgetNotes-Windows-x64.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: WidgetNotes-Windows-x64
          path: dist
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" .\dist\WidgetNotes-Windows-x64.zip --verify-tag --generate-notes --title "WidgetNotes $env:GITHUB_REF_NAME"
